<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📚 UPSC Syllabus – Triple Checklist</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ===== THEME VARIABLES ===== */
        :root {
            --bg-body: #f4f7fc;
            --bg-card: #ffffff;
            --bg-card-hover: #f0f4fa;
            --bg-header: #ffffff;
            --bg-filter: #ffffff;
            --border-color: #d0d9e8;
            --text-primary: #1a2332;
            --text-secondary: #3a4a62;
            --text-muted: #6a7f9a;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            --radius: 14px;
            --accent-blue: #3b7bff;
            --accent-gold: #f5b342;
            --accent-green: #34c759;
            --accent-purple: #8b5cf6;
            --accent-red: #ef4444;
            --checkbox-bg: #e9edf4;
            --checkbox-checked: #3b7bff;
            --note-bg: #f9faff;
            --note-border: #d0d9e8;
            --scrollbar-track: #e9edf4;
            --scrollbar-thumb: #b0c0d8;
            --timer-bg: #e9edf4;
            --clock-glow: rgba(59, 123, 255, 0.15);
            --timer-glow: rgba(245, 179, 66, 0.15);
            --clock-color: #3b7bff;
            --timer-color: #f5b342;
            --tab-inactive: #d0d9e8;
            --tab-active: #3b7bff;
        }

        [data-theme="dark"] {
            --bg-body: #0b0e1a;
            --bg-card: #141b2b;
            --bg-card-hover: #1c2640;
            --bg-header: #141b2b;
            --bg-filter: #141b2b;
            --border-color: #2a3a5a;
            --text-primary: #e8edf5;
            --text-secondary: #a0b4d0;
            --text-muted: #6a7fa0;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            --accent-blue: #4a8bf5;
            --accent-gold: #f5c842;
            --accent-green: #3ddc84;
            --accent-purple: #a855f7;
            --accent-red: #f55a5a;
            --checkbox-bg: #1e2a3e;
            --checkbox-checked: #4a8bf5;
            --note-bg: #0f1626;
            --note-border: #2a3a5a;
            --scrollbar-track: #1a2332;
            --scrollbar-thumb: #3a4a62;
            --timer-bg: #1a2332;
            --clock-glow: rgba(74, 139, 245, 0.35);
            --timer-glow: rgba(245, 200, 66, 0.30);
            --clock-color: #4a8bf5;
            --timer-color: #f5c842;
            --tab-inactive: #2a3a5a;
            --tab-active: #4a8bf5;
        }

        /* ===== RESET & BASE ===== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
            transition: background 0.3s, color 0.3s;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--scrollbar-track);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-blue);
        }

        /* ===== HEADER ===== */
        .app-header {
            max-width: 1440px;
            margin: 0 auto 20px;
            padding: 18px 28px;
            background: var(--bg-header);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            transition: background 0.3s, border 0.3s;
            position: sticky;
            top: 16px;
            z-index: 100;
            backdrop-filter: blur(8px);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .header-left .logo-icon {
            font-size: 1.8rem;
            line-height: 1;
        }
        .header-left h1 {
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-gold), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header-left .subtitle {
            font-size: 0.7rem;
            color: var(--text-muted);
            display: block;
            -webkit-text-fill-color: var(--text-muted);
        }

        .header-right {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
        }

        .clock-timer {
            display: flex;
            align-items: center;
            gap: 18px;
            background: var(--timer-bg);
            padding: 6px 20px 6px 14px;
            border-radius: 40px;
            border: 1px solid var(--border-color);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 2px 8px rgba(0, 0, 0, 0.04);
            transition: background 0.3s, border 0.3s;
            backdrop-filter: blur(4px);
        }

        .clock-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .live-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: var(--accent-green);
            border-radius: 50%;
            animation: pulse-dot 1.8s ease-in-out infinite;
            box-shadow: 0 0 12px rgba(52, 199, 89, 0.4);
            flex-shrink: 0;
        }
        [data-theme="dark"] .live-dot {
            box-shadow: 0 0 16px rgba(61, 220, 132, 0.5);
        }

        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.3;
                transform: scale(0.7);
            }
        }

        .clock {
            font-family: 'Courier New', monospace;
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--clock-color);
            text-shadow: 0 0 20px var(--clock-glow);
            font-variant-numeric: tabular-nums;
            min-width: 90px;
            text-align: center;
        }

        .clock-separator {
            color: var(--text-muted);
            font-weight: 300;
            font-size: 1rem;
            opacity: 0.5;
            padding: 0 2px;
        }

        .timer-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            padding-left: 6px;
            border-left: 1.5px solid var(--border-color);
        }

        .timer-display {
            font-family: 'Courier New', monospace;
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: var(--timer-color);
            text-shadow: 0 0 20px var(--timer-glow);
            font-variant-numeric: tabular-nums;
            min-width: 70px;
            text-align: center;
        }

        .timer-controls {
            display: flex;
            gap: 2px;
            margin-left: 4px;
        }
        .timer-controls .btn-tiny {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 30px;
            transition: 0.2s;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .timer-controls .btn-tiny:hover {
            background: var(--border-color);
            color: var(--text-primary);
            transform: scale(1.1);
        }
        .timer-controls .btn-tiny.start {
            color: var(--accent-green);
        }
        .timer-controls .btn-tiny.start:hover {
            background: rgba(52, 199, 89, 0.15);
        }
        .timer-controls .btn-tiny.stop {
            color: var(--accent-red);
        }
        .timer-controls .btn-tiny.stop:hover {
            background: rgba(239, 68, 68, 0.15);
        }
        .timer-controls .btn-tiny.reset {
            color: var(--text-muted);
        }
        .timer-controls .btn-tiny.reset:hover {
            background: var(--border-color);
        }

        .header-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border: none;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease;
            background: var(--border-color);
            color: var(--text-primary);
            text-decoration: none;
            white-space: nowrap;
            border: 1px solid transparent;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }
        .btn-primary {
            background: var(--accent-blue);
            color: #fff;
        }
        .btn-primary:hover {
            filter: brightness(1.1);
        }
        .btn-success {
            background: var(--accent-green);
            color: #fff;
        }
        .btn-success:hover {
            filter: brightness(1.1);
        }
        .btn-gold {
            background: var(--accent-gold);
            color: #1a1a2e;
        }
        .btn-gold:hover {
            filter: brightness(1.05);
        }
        .btn-outline {
            background: transparent;
            border: 1.5px solid var(--border-color);
            color: var(--text-secondary);
        }
        .btn-outline:hover {
            border-color: var(--accent-blue);
            color: var(--text-primary);
            background: rgba(74, 139, 245, 0.08);
        }
        .btn-danger {
            background: var(--accent-red);
            color: #fff;
        }
        .btn-danger:hover {
            filter: brightness(1.1);
        }

        .theme-toggle .fa-sun {
            display: inline;
        }
        [data-theme="dark"] .theme-toggle .fa-sun {
            display: none;
        }
        .theme-toggle .fa-moon {
            display: none;
        }
        [data-theme="dark"] .theme-toggle .fa-moon {
            display: inline;
        }

        /* ===== TAB BAR ===== */
        .tab-bar {
            max-width: 1440px;
            margin: 0 auto 16px;
            display: flex;
            gap: 0;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: background 0.3s;
            flex-wrap: wrap;
        }
        .tab-btn {
            flex: 1;
            min-width: 120px;
            padding: 12px 16px;
            border: none;
            background: var(--bg-body);
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            border-right: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .tab-btn:last-child {
            border-right: none;
        }
        .tab-btn:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
        }
        .tab-btn.active {
            background: var(--tab-active);
            color: #fff;
            box-shadow: inset 0 -3px 0 var(--accent-gold);
        }
        .tab-btn .tab-icon {
            font-size: 1.1rem;
        }
        .tab-btn .tab-label {
            font-size: 0.8rem;
        }
        .tab-btn .tab-count {
            font-size: 0.6rem;
            opacity: 0.7;
            background: rgba(255,255,255,0.15);
            padding: 1px 8px;
            border-radius: 10px;
        }
        .tab-btn.active .tab-count {
            background: rgba(255,255,255,0.2);
        }
        @media (max-width: 600px) {
            .tab-btn .tab-label {
                font-size: 0.7rem;
            }
            .tab-btn {
                padding: 8px 10px;
                min-width: 80px;
            }
            .tab-btn .tab-count {
                font-size: 0.5rem;
                padding: 0 6px;
            }
        }

        /* ===== PROGRESS ===== */
        .progress-wrapper {
            max-width: 1440px;
            margin: 0 auto 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 10px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            transition: background 0.3s;
        }
        .progress-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .progress-bar-bg {
            flex: 1;
            min-width: 120px;
            height: 8px;
            background: var(--checkbox-bg);
            border-radius: 20px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-gold), var(--accent-blue));
            border-radius: 20px;
            transition: width 0.4s ease;
        }
        .progress-text {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            white-space: nowrap;
        }

        /* ===== NOTES ===== */
        .notes-section {
            max-width: 1440px;
            margin: 0 auto 20px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 16px 22px;
            transition: background 0.3s;
        }
        .notes-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .notes-header h3 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .notes-header h3 i {
            color: var(--accent-gold);
        }
        .notes-textarea {
            width: 100%;
            min-height: 90px;
            padding: 12px 16px;
            background: var(--note-bg);
            color: var(--text-primary);
            border: 1px solid var(--note-border);
            border-radius: 10px;
            font-size: 0.9rem;
            font-family: inherit;
            resize: vertical;
            transition: border 0.2s;
        }
        .notes-textarea:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(74, 139, 245, 0.15);
        }
        .notes-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        /* ===== FILTER BAR ===== */
        .filter-bar {
            max-width: 1440px;
            margin: 0 auto 20px;
            padding: 14px 22px;
            background: var(--bg-filter);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px 20px;
            transition: background 0.3s;
        }
        .filter-bar .filter-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .filter-group {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }
        .filter-chip {
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            border: 1.5px solid var(--border-color);
            background: transparent;
            color: var(--text-secondary);
            transition: 0.2s;
        }
        .filter-chip:hover {
            border-color: var(--accent-blue);
            color: var(--text-primary);
        }
        .filter-chip.active {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            color: #fff;
        }
        .filter-chip.priority-5.active {
            background: var(--accent-gold);
            border-color: var(--accent-gold);
            color: #1a1a2e;
        }
        .filter-chip.priority-4.active {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            color: #fff;
        }
        .filter-chip.priority-3.active {
            background: var(--accent-green);
            border-color: var(--accent-green);
            color: #1a1a2e;
        }

        .filter-bar .search-box {
            flex: 1;
            min-width: 150px;
            display: flex;
            align-items: center;
            background: var(--bg-body);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 0 12px;
            transition: 0.2s;
        }
        .filter-bar .search-box:focus-within {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(74, 139, 245, 0.15);
        }
        .filter-bar .search-box i {
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        .filter-bar .search-box input {
            background: transparent;
            border: none;
            padding: 9px 10px;
            color: var(--text-primary);
            font-size: 0.85rem;
            width: 100%;
            outline: none;
        }
        .filter-bar .search-box input::placeholder {
            color: var(--text-muted);
        }
        .filter-stats {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-left: auto;
            white-space: nowrap;
        }
        .filter-stats strong {
            color: var(--text-primary);
        }

        /* ===== CATEGORY GRID ===== */
        .container {
            max-width: 1440px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .category-section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            overflow: hidden;
            transition: background 0.3s, border 0.3s;
            box-shadow: var(--shadow);
        }

        .category-header {
            padding: 14px 22px;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            cursor: pointer;
            user-select: none;
            transition: 0.2s;
        }
        .category-header:hover {
            background: rgba(255, 255, 255, 0.04);
        }
        .category-header .cat-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .category-header .cat-icon {
            font-size: 1.3rem;
        }
        .category-header .cat-name {
            font-size: 1.05rem;
            font-weight: 700;
        }
        .category-header .cat-badge {
            font-size: 0.7rem;
            padding: 3px 12px;
            border-radius: 20px;
            background: var(--border-color);
            color: var(--text-secondary);
            font-weight: 600;
        }
        .category-header .cat-toggle {
            color: var(--text-muted);
            font-size: 0.9rem;
            transition: 0.2s;
        }
        .category-header .cat-toggle.open {
            transform: rotate(180deg);
        }

        .category-body {
            padding: 16px 22px 22px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 18px;
        }
        .category-body.collapsed {
            display: none;
        }

        /* ===== TOPIC CARD ===== */
        .topic-card {
            background: var(--bg-body);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px 16px 16px 14px;
            transition: 0.2s;
            position: relative;
        }
        .topic-card:hover {
            border-color: var(--accent-blue);
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
            background: var(--bg-card-hover);
        }

        .topic-card .priority-strip {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            border-radius: 12px 0 0 12px;
        }
        .topic-card .priority-strip.p5 {
            background: linear-gradient(180deg, var(--accent-gold), #f59e0b);
        }
        .topic-card .priority-strip.p4 {
            background: linear-gradient(180deg, var(--accent-blue), #6c5ce7);
        }
        .topic-card .priority-strip.p3 {
            background: linear-gradient(180deg, var(--accent-green), #00b894);
        }
        .topic-card .priority-strip.p2 {
            background: linear-gradient(180deg, var(--accent-cyan), #0891b2);
        }
        .topic-card .priority-strip.p1 {
            background: linear-gradient(180deg, var(--text-muted), #4a5568);
        }

        .topic-card .topic-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 10px;
            padding-left: 4px;
        }
        .topic-card .topic-name {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        .topic-card .priority-badge {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.6rem;
            font-weight: 700;
            padding: 2px 10px 2px 6px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            white-space: nowrap;
            flex-shrink: 0;
        }
        .priority-badge .stars {
            color: var(--accent-gold);
            font-size: 0.55rem;
            letter-spacing: 0.5px;
        }
        .priority-badge .freq {
            color: var(--text-muted);
            font-size: 0.55rem;
        }

        .subtopic-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding-left: 4px;
        }
        .subtopic-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 3px 6px 3px 4px;
            border-radius: 6px;
            transition: 0.15s;
            cursor: default;
        }
        .subtopic-item:hover {
            background: rgba(255, 255, 255, 0.04);
        }
        .subtopic-item .sub-checkbox {
            flex-shrink: 0;
            appearance: none;
            width: 16px;
            height: 16px;
            border: 2px solid var(--border-color);
            border-radius: 4px;
            background: var(--checkbox-bg);
            cursor: pointer;
            transition: 0.2s;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .subtopic-item .sub-checkbox:checked {
            background: var(--checkbox-checked);
            border-color: var(--checkbox-checked);
        }

        // ============================================================

        let activeTab = 'previous';
        let completedSubtasks = new Set();

        // ============================================================
        // STORAGE KEYS
        // ============================================================
        function getStorageKeys() {
            if (activeTab === 'previous') {
                return {
                    completedKey: 'upiac_subtask_completed',
                    notesKey: 'upiac_notes',
                    themeKey: 'upiac_theme'
                };
            } else if (activeTab === 'cgpsc') {
                return {
                    completedKey: 'cgpsc_subtask_completed',
                    notesKey: 'cgpsc_notes',
                    themeKey: 'upiac_theme'
                };
            } else {
                return {
                    completedKey: 'philosophy_subtask_completed',
                    notesKey: 'philosophy_notes',
                    themeKey: 'upiac_theme'
                };
            }
        }

        // ============================================================
        // LOAD / SAVE
        // ============================================================
        function loadState() {
            const keys = getStorageKeys();
            try {
                const stored = localStorage.getItem(keys.completedKey);
                if (stored) {
                    const arr = JSON.parse(stored);
                    completedSubtasks = new Set(arr);
                } else {
                    completedSubtasks = new Set();
                }
                const notes = localStorage.getItem(keys.notesKey);
                if (notes !== null) {
                    document.getElementById('notesTextarea').value = notes;
                } else {
                    document.getElementById('notesTextarea').value = '';
                }
                const theme = localStorage.getItem('upiac_theme');
                if (theme === 'dark') {
                    document.documentElement.setAttribute('data-theme', 'dark');
                } else {
                    document.documentElement.removeAttribute('data-theme');
                }
            } catch (e) {
                completedSubtasks = new Set();
            }
        }

        function saveCompleted() {
            const keys = getStorageKeys();
            localStorage.setItem(keys.completedKey, JSON.stringify([...completedSubtasks]));
            updateProgress();
        }

        function saveNotes() {
            const keys = getStorageKeys();
            localStorage.setItem(keys.notesKey, document.getElementById('notesTextarea').value);
        }

        function saveTheme(theme) {
            localStorage.setItem('upiac_theme', theme);
        }

        // ============================================================
        // PROGRESS
        // ============================================================
        function getCurrentData() {
            if (activeTab === 'previous') return syllabusDataPrevious;
            if (activeTab === 'cgpsc') return syllabusDataCGPSC;
            return syllabusDataPhilosophy;
        }

        function getTotalSubtopics() {
            let count = 0;
            getCurrentData().forEach(cat => {
                cat.topics.forEach(t => {
                    count += t.subtopics.length;
                });
            });
            return count;
        }

        function updateProgress() {
            const total = getTotalSubtopics();
            const done = completedSubtasks.size;
            const pct = total === 0 ? 0 : Math.round((done / total) * 100);
            document.getElementById('progressFill').style.width = pct + '%';
            document.getElementById('progressText').textContent = done + ' / ' + total;
        }

        // ============================================================
        // TOGGLE SUBTOPIC
        // ============================================================
        function toggleSubtopic(subtaskId, checkbox) {
            if (checkbox.checked) {
                completedSubtasks.add(subtaskId);
            } else {
                completedSubtasks.delete(subtaskId);
            }
            saveCompleted();
            const label = checkbox.closest('.subtopic-item').querySelector('.sub-label');
            if (label) {
                if (checkbox.checked) {
                    label.classList.add('checked');
                } else {
                    label.classList.remove('checked');
                }
            }
            const card = checkbox.closest('.topic-card');
            if (card) {
                updateTopicProgress(card);
            }
        }

        function updateTopicProgress(card) {
            const checkboxes = card.querySelectorAll('.sub-checkbox');
            const total = checkboxes.length;
            const checked = card.querySelectorAll('.sub-checkbox:checked').length;
            const prog = card.querySelector('.topic-progress');
            if (prog) {
                prog.textContent = `${checked}/${total}`;
            }
        }

        // RESET & CLEAR
        // ============================================================
        function resetProgress() {
            if (confirm('Are you sure you want to reset all checkmarks for this syllabus?')) {
                completedSubtasks.clear();
                saveCompleted();
                render();
            }
        }

        function clearNotes() {
            if (confirm('Clear all notes for this syllabus?')) {
                document.getElementById('notesTextarea').value = '';
                saveNotes();

        // ============================================================

            const html = document.documentElement;
            if (html.getAttribute('data-theme') === 'dark') {
                html.removeAttribute('data-theme');
                saveTheme('light');
            } else {
                html.setAttribute('data-theme', 'dark');
                saveTheme('dark');
            }
        }

        // ============================================================
        // TAB SWITCHING
        // ============================================================
        function switchTab(tab) {
            if (tab === activeTab) return;
            activeTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tab === tab);
            });
            const title = document.getElementById('mainTitle');
            const subtitle = document.getElementById('mainSubtitle');
            if (tab === 'previous') {
                title.textContent = 'UPSC Syllabus';
                subtitle.textContent = 'History · Polity · Public Admin · Chhattisgarh';
            } else if (tab === 'cgpsc') {
                title.textContent = 'CGPSC Syllabus';
                subtitle.textContent = 'History · Constitution & Public Admin · Chhattisgarh';
            } else {
                title.textContent = 'Philosophy & Sociology';
                subtitle.textContent = 'Philosophy · Sociology · Social Aspect of Chhattisgarh';
            }
            loadState();
            render();
            expandAll();
        }

        // ============================================================
        // RENDER
        // ============================================================
        function render() {
            const container = document.getElementById('mainContainer');
            const search = currentSearchQuery.toLowerCase().trim();
            const priority = currentPriorityFilter;
            const data = getCurrentData();

            let totalVisible = 0;
            let html = '';

            data.forEach(category => {
                const filteredTopics = category.topics.filter(topic => {
                    const matchPriority = priority === 'all' || topic.priority === parseInt(priority);
                    const matchSearch = search === '' ||
                        topic.name.toLowerCase().includes(search) ||
                        topic.subtopics.some(st => st.toLowerCase().includes(search));
                    return matchPriority && matchSearch;
                });

                if (filteredTopics.length === 0) return;
                totalVisible += filteredTopics.length;

                const catId = category.id;

                html += `
                        <div class="category-section" data-category="${catId}">
                            <div class="category-header" onclick="toggleCategory('${catId}')">
                                <div class="cat-left">
                                    <span class="cat-icon">${category.icon}</span>
                                    <span class="cat-name">${category.name}</span>
                                    <span class="cat-badge">${filteredTopics.length}</span>
                                </div>
                                <span class="cat-toggle open" id="toggle-${catId}">
                                    <i class="fas fa-chevron-down"></i>
                                </span>
                            </div>
                            <div class="category-body" id="body-${catId}">
                        `;

                filteredTopics.forEach((topic) => {
                    const p = topic.priority;
                    const stars = '⭐'.repeat(p);
                    const stripClass = p === 5 ? 'p5' : p === 4 ? 'p4' : p === 3 ? 'p3' : p === 2 ? 'p2' :
                        'p1';
                    const topicId = catId + '_' + topic.name.replace(/\s+/g, '_');

                    let completedCount = 0;
                    topic.subtopics.forEach(st => {
                        const sid = topicId + '_' + st.replace(/\s+/g, '_');
                        if (completedSubtasks.has(sid)) completedCount++;
                    });
                    const totalSubs = topic.subtopics.length;

                    html += `
                            <div class="topic-card" data-priority="${p}" data-name="${topic.name.toLowerCase()}">
                                <div class="priority-strip ${stripClass}"></div>
                                <div class="topic-header">
                                    <span class="topic-name">${topic.name}</span>
                                    <div style="display:flex;align-items:center;gap:8px;">
                                        <span class="topic-progress">${completedCount}/${totalSubs}</span>
                                        <span class="priority-badge">
                                            <span class="stars">${stars}</span>
                                            <span class="freq">${activeTab === 'previous' ? (p === 5 ? '38+' : p === 4 ? '11+' : '6+') : activeTab === 'cgpsc' ? 'CGPSC' : 'Phil'}</span>
                                        </span>
                                    </div>
                                </div>
                                <div class="subtopic-list">
                        `;

                    topic.subtopics.forEach(st => {
                        const subId = topicId + '_' + st.replace(/\s+/g, '_');
                        const checked = completedSubtasks.has(subId) ? 'checked' : '';
                        const checkedClass = completedSubtasks.has(subId) ? 'checked' : '';

                        html += `
                                <div class="subtopic-item">
                                    <input type="checkbox" class="sub-checkbox" id="chk_${subId}" ${checked} onchange="toggleSubtopic('${subId}', this)" />
                                    <label for="chk_${subId}" class="sub-label ${checkedClass}">${st}</label>
                                </div>
                            `;
                    });

                    html += `
                                </div>
                            </div>
                        `;
                });

                html += `
                            </div>
                        </div>
                    `;
            });

            if (totalVisible === 0) {
                html = `
                        <div class="category-section" style="padding:48px 24px;text-align:center;">
                            <div class="no-results">
                                <i class="fas fa-search" style="font-size:3rem;opacity:0.3;"></i>
                                <p style="font-size:1.1rem;color:var(--text-secondary);">No topics match your filters.</p>
                                <p style="font-size:0.85rem;color:var(--text-muted);margin-top:6px;">Try adjusting the priority filter or search term.</p>
                                <button class="btn btn-gold" style="margin-top:16px;" onclick="resetFilters()">
                                    <i class="fas fa-undo-alt"></i> Reset Filters
                                </button>
                            </div>
                        </div>
                    `;
            }

            container.innerHTML = html;
            document.getElementById('visibleCount').textContent = totalVisible;
            updateProgress();
        }

        // ============================================================
        // CATEGORY TOGGLE
        // ============================================================
        function toggleCategory(id) {
            const body = document.getElementById(`body-${id}`);
            const toggle = document.getElementById(`toggle-${id}`);
            if (!body || !toggle) return;
            body.classList.toggle('collapsed');
            toggle.classList.toggle('open');
        }

        function expandAll() {
            document.querySelectorAll('.category-body').forEach(el => el.classList.remove('collapsed'));
            document.querySelectorAll('.cat-toggle').forEach(el => el.classList.add('open'));
        }

        function collapseAll() {
            document.querySelectorAll('.category-body').forEach(el => el.classList.add('collapsed'));
            document.querySelectorAll('.cat-toggle').forEach(el => el.classList.remove('open'));
        }

        function resetFilters() {
            currentPriorityFilter = 'all';
            currentSearchQuery = '';
            document.getElementById('searchInput').value = '';
            document.querySelectorAll('.filter-chip').forEach(chip => chip.classList.remove('active'));
            document.querySelector('.filter-chip[data-priority="all"]').classList.add('active');
            render();
            expandAll();
        }

        // ============================================================
        // CLOCK & TIMER
        // ============================================================
        let timerSeconds = 0;
        let timerInterval = null;
        let timerRunning = false;

        function updateClock() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('en-IN', { hour12: false });
            document.getElementById('clockDisplay').textContent = timeStr;
        }

        function updateTimerDisplay() {
            const mins = Math.floor(timerSeconds / 60);
            const secs = timerSeconds % 60;
            document.getElementById('timerDisplay').textContent =
                String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
        }

        function startTimer() {
            if (timerRunning) return;
            timerRunning = true;
            timerInterval = setInterval(() => {
                timerSeconds++;
                updateTimerDisplay();
            }, 1000);
        }

        function pauseTimer() {
            if (!timerRunning) return;
            timerRunning = false;
            clearInterval(timerInterval);
            timerInterval = null;
        }

        function resetTimer() {
            pauseTimer();
            timerSeconds = 0;
            updateTimerDisplay();
        }

        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('timerStartBtn').addEventListener('click', startTimer);
            document.getElementById('timerPauseBtn').addEventListener('click', pauseTimer);
            document.getElementById('timerResetBtn').addEventListener('click', resetTimer);
            updateClock();
            setInterval(updateClock, 1000);
        });

        // ============================================================
        // EVENT BINDING
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            loadState();

            document.querySelectorAll('.filter-chip').forEach(chip => {
                chip.addEventListener('click', function() {
                    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
                    this.classList.add('active');
                    currentPriorityFilter = this.dataset.priority;
                    render();
                });
            });

            const searchInput = document.getElementById('searchInput');
            let debounceTimer;
            searchInput.addEventListener('input', function() {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    currentSearchQuery = this.value;
                    render();
                }, 200);
            });

            const notesTextarea = document.getElementById('notesTextarea');
            notesTextarea.addEventListener('input', function() {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    saveNotes();
                }, 400);
            });

            render();
            expandAll();
        });

        // Expose globals
